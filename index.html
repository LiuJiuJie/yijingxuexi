          <p>${h.yi}</p>
          <div style="margin-top:14px">
            <button class="btn ${isDone(h.n)?"ghost":"cinnabar"}" onclick="toggleDone(${h.n});renderDetail(${h.n})">${isDone(h.n)?"取消已读":"标记已读"}</button>
          </div>
        </div>
      </div>
      <h3 style="margin:22px 0 8px">六爻详解</h3>
      <p class="muted" style="margin-bottom:8px">自下而上：初为始，二五为中，上为终。阳称九，阴称六。</p>
      ${h.yao.map(y => `
        <div class="yao-item">
          <div class="yuan"><b>${y.name}</b>${y.text}</div>
          <div class="row trans"><span class="lab2">白话</span>${y.trans || ""}</div>
          <div class="row explain"><span class="lab2">讲解</span>${y.explain || y.note || ""}</div>
        </div>
      `).join("")}
      <div class="note-box" style="margin-top:18px">
        <div class="kicker">我的笔记</div>
        <textarea id="noteArea" placeholder="写下这一卦与你此刻的对应……">${note.replace(/</g,"&lt;")}</textarea>
        <div style="margin-top:8px"><button class="btn" onclick="saveNote(${h.n})">保存笔记</button></div>
      </div>
      <div class="pager">
        <button class="btn ghost" onclick="openGua(${prev})">上一卦 ${guaByN(prev).name}</button>
        <button class="btn ghost" onclick="showView('guas');renderGuas()">返回总表</button>
        <button class="btn ghost" onclick="openGua(${next})">下一卦 ${guaByN(next).name}</button>
      </div>
    </div>
  `;
}

function saveNote(n) {
  S.notes[n] = document.getElementById("noteArea").value;
  store.save(S);
  const btn = event.target; const t = btn.textContent; btn.textContent = "已保存";
  setTimeout(() => btn.textContent = t, 900);
}

function coinToss() {
  // 3 coins: heads=3 yang, tails=2 yin. 6/7/8/9
  const coins = [0,0,0].map(() => Math.random() < .5 ? 3 : 2);
  const sum = coins.reduce((a,b)=>a+b,0);
  return { coins, sum, yang: sum % 2 === 1, changing: sum === 6 || sum === 9 };
}

function bitsToGua(bits) {
  const key = bits.join("");
  return DATA.hexagrams.find(h => h.bits.join("") === key);
}

function renderCast() {
  $("view-cast").innerHTML = `
    <div class="card">
      <div class="kicker">三钱法（演示）</div>
      <h2>起一卦，对照经文</h2>
      <p>心中默想一事，点击六次（自下而上）或一次自动六爻。三钱：两背一字为少阳七，两字一背为少阴八，三字为老阳九（变阴），三背为老阴六（变阳）。本页只作经文对照练习，不作吉凶断言。</p>
      <div style="margin:16px 0">
        <button class="btn cinnabar" onclick="autoCast()">一键六爻</button>
        <button class="btn ghost" onclick="stepCast()">逐爻投掷</button>
      </div>
      <div id="castBox"></div>
    </div>
  `;
}

let stepBits = [];
function autoCast() {
  const lines = [];
  for (let i=0;i<6;i++) lines.push(coinToss());
  drawCast(lines);
}
function stepCast() {
  if (stepBits.length >= 6) stepBits = [];
  stepBits.push(coinToss());
  drawCast(stepBits);
}
function drawCast(lines) {
  const bits = lines.map(l => l.yang ? 1 : 0);
  while (bits.length < 6) bits.push(null);
  const changed = lines.map(l => l.yang ? (l.changing ? 0 : 1) : (l.changing ? 1 : 0));
  const primary = lines.length === 6 ? bitsToGua(lines.map(l => l.yang?1:0)) : null;
  const secondary = lines.length === 6 ? bitsToGua(changed) : null;
  document.getElementById("castBox").innerHTML = `
    <div class="coins">${(lines[lines.length-1] ? lines[lines.length-1].coins : []).map((c,i)=>`<div class="coin">${c===3?"背":"字"}</div>`).join("")}</div>
    <p class="muted" style="text-align:center">已得 ${lines.length} / 6 爻（自下而上）</p>
    <div class="cast-lines">
      ${[0,1,2,3,4,5].map(i => {
        const l = lines[i];
        if (!l) return `<div class="yao-line yin" style="opacity:.15"></div>`;
        return `<div class="yao-line ${l.yang?"yang":"yin"}" title="${l.sum}"></div>`;
      }).join("")}
    </div>
    ${primary ? `
      <div style="text-align:center;margin-top:18px">
        <h3>本卦　${primary.sym} ${primary.n}${primary.name}</h3>
        <p>${primary.gua}</p>
        <button class="btn" onclick="openGua(${primary.n})">阅读本卦</button>
        ${secondary && secondary.n !== primary.n ? `<p style="margin-top:10px">之卦　${secondary.sym} ${secondary.n}${secondary.name}</p>
        <button class="btn ghost" onclick="openGua(${secondary.n})">阅读之卦</button>` : ""}
      </div>` : ""}
  `;
}

  $("view-progress").innerHTML = `

const GATE_KEY = "yijing-unlocked-v1";
const GATE_PASS = "88888888";

function unlockApp() {
  document.body.classList.remove("locked");
  document.body.classList.add("unlocked");
  sessionStorage.setItem(GATE_KEY, "1");
  refreshProgress();
  const hash = location.hash || "";
  const m = hash.match(/gua-(\d+)/);
  if (m) { openGua(Number(m[1])); }
  else { renderHome(); }
}

function bindLock() {
  const form = document.getElementById("lockForm");
  const input = document.getElementById("lockInput");
  const msg = document.getElementById("lockMsg");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if ((input.value || "") === GATE_PASS) {
      msg.textContent = "";
      unlockApp();
    } else {
      msg.textContent = "口令不对，请再试。";
      input.value = "";
      input.focus();
    }
  });
}

function boot() {
  bindLock();
  if (sessionStorage.getItem(GATE_KEY) === "1") {
    unlockApp();
  } else {
    const input = document.getElementById("lockInput");
    if (input) input.focus();
  }
}
boot();
</script>
